<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Admin - Ajouter un film</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./component/MovieForm/style.css" />
</head>
<body>
  <h1>Ajouter un film</h1>
  <section id="log"></section>
  <section id="form"></section>
  <script type="module">
    import { setupMovieForm } from './component/MovieForm/script.js';
    import { DataMovie } from './data/dataMovie.js';

    // Affiche le formulaire
    fetch('./component/MovieForm/template.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('form').innerHTML = html;
        setupMovieForm(addMovie);
      });

    // Affiche un message dans la zone log
    function showLog(msg, color = 'green') {
      document.getElementById('log').innerHTML = `<div style="color:${color};padding:1rem;">${msg}</div>`;
    }

    // Fonction appelée quand on soumet le formulaire
    async function addMovie(data) {
      showLog('Ajout du film en cours...', 'blue');
      const result = await DataMovie.add(data);
      if (result && result.success) {
        showLog(result.success, 'green');
        document.getElementById('movieForm').reset();
      } else {
        showLog(result.error || 'Erreur inconnue.', 'red');
      }
    }
  </script>
</body>
</html>
