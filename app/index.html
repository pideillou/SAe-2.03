<!DOCTYPE html>
<html lang="fr">
  <head>
    <title>SAE2.03 APP</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/global.css" />
  </head>

  <body>
    <header id="header"></header>

    <section id="content"></section>

    <script type="module">
      import { NavBar } from "./component/NavBar/script.js";

      // Controleur
      // Rappel, écrire window.C plutôt que let C est nécessaire pour tester depuis la console du navigateur
      // Une fois l'application terminée, on pourrait remettre let C.
      window.C = {};

      C.handlerAbout = function () {
        alert(
          "Ceci est une base de projet pour la SAE2.03 édition 2025. Bonne chance !"
        );
      };

      C.handlerDetail = async function(id) {
        const { DataMovie } = await import("./data/dataMovie.js");
        const { MovieDetail } = await import("./component/MovieDetail/script.js");
        const movie = await DataMovie.requestMovieDetails(id);
        let content = document.querySelector("#content");
        content.innerHTML = "";
        content.appendChild(MovieDetail.render(movie));
      };

      C.start = function () {
        V.renderNavBar("C.handlerAbout()");
      };

      // Vue (contient tout ce qui est relatif à l'affichage)
      window.V = {};

      /**
       * V.renderNavBar
       *
       * Cette fonction est responsable de l'affichage de la barre de navigation (NavBar).
       * Elle sélectionne l'élément HTML avec l'ID "header" et y insère le contenu
       * formaté par le composant NavBar.
       */
      V.renderNavBar = function (hAbout) {
        let header = document.querySelector("#header");
        header.innerHTML = NavBar.format(hAbout);
      };

     // Affichage du Menu (grille de films)

     V.renderMenu = async function () {
       // Charger le template
       const templateFile = await fetch("./component/Movie/template.html");
       const template = await templateFile.text();
       let content = document.querySelector("#content");
       content.innerHTML = template;

       // Charger le composant Movie
       const { Movie } = await import("./component/Movie/index.js");
       const { DataMovie } = await import("./data/dataMovie.js");
       // Récupérer les films et afficher
       DataMovie.requestMovies().then(films => {
         const grid = document.getElementById("movieGrid");
         grid.innerHTML = Movie.format(films);
         // Ajout des listeners après injection du HTML
         grid.querySelectorAll('.movie-card').forEach((card, i) => {
           card.addEventListener('click', () => {
             C.handlerDetail(films[i].id);
           });
         });
       });
     };

      C.start = function () {
        V.renderNavBar("C.handlerAbout()");
        V.renderMenu();
      };

      C.start(); // Démarre l'application
    </script>
  </body>
</html>
<script type="module"></script>
