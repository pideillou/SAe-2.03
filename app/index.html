<!doctype html>
<html lang="fr">
  <head>
    <title>SAE2.03 APP</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/global.css" />
  </head>

  <body>
    <header id="header"></header>

    <section id="content"></section>

    <script type="module">
      import { NavBar } from "./component/NavBar/script.js";

      // Controleur
      // Rappel, écrire window.C plutôt que let C est nécessaire pour tester depuis la console du navigateur
      // Une fois l'application terminée, on pourrait remettre let C.
      window.C = {};

      C.handlerAbout = function () {
        alert(
          "Ceci est une base de projet pour la SAE2.03 édition 2025. Bonne chance !",
        );
      };

      C.handlerDetail = async function (id) {
        let DataMovie = (await import("./data/dataMovie.js")).DataMovie;
        let MovieDetail = (await import("./component/MovieDetail/script.js"))
          .MovieDetail;
        let content = document.querySelector("#content");
        content.innerHTML = "";
        try {
          let movie = await DataMovie.requestMovieDetails(id);
          content.appendChild(MovieDetail.render(movie));
        } catch (e) {
          content.innerHTML =
            '<div style="color:red">Erreur lors du chargement des détails du film.</div>';
        }
      };

      C.start = function () {
        V.renderNavBar("C.handlerAbout()");
      };

      // Vue (contient tout ce qui est relatif à l'affichage)
      window.V = {};

      /**
       * V.renderNavBar
       *
       * Cette fonction est responsable de l'affichage de la barre de navigation (NavBar).
       * Elle sélectionne l'élément HTML avec l'ID "header" et y insère le contenu
       * formaté par le composant NavBar.
       */
      V.renderNavBar = function (hAbout) {
        let header = document.querySelector("#header");
        header.innerHTML = NavBar.format(hAbout);
      };

      // Affichage du Menu (grille de films)

      V.renderMenu = async function () {
        let DataMovie = (await import("./data/dataMovie.js")).DataMovie;
        let MovieCategory = (
          await import("./component/MovieCategory/script.js")
        ).MovieCategory;
        let content = document.querySelector("#content");
        content.innerHTML = "";
        try {
          let grouped = await DataMovie.requestMoviesByCategory();
          for (let cat in grouped) {
            content.appendChild(MovieCategory.render(cat, grouped[cat]));
          }
        } catch (e) {
          content.innerHTML =
            '<div style="color:red">Erreur lors du chargement des films par catégorie.</div>';
        }
      };

      C.start = function () {
        V.renderNavBar("C.handlerAbout()");
        V.renderMenu();
      };

      C.start(); // Démarre l'application
    </script>
  </body>
</html>
<script type="module"></script>
