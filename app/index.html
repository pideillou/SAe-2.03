<!doctype html>
<html lang="fr">
  <head>
    <title>Flouflix</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="icon" type="image/png" href="../server/images/logo.png" />
  </head>

  <body>
    <header id="header"></header>

    <section id="content"></section>

    <script type="module">
      import { NavBar } from "./component/NavBar/script.js";

      window.C = {};

      C.handlerAbout = function () {
        alert(
          "Ceci est une base de projet pour la SAE2.03 édition 2025. Bonne chance !",
        );
      };

      C.handlerHome = function () {
        V.renderMenu();
        return false;
      };

      C.handlerDetail = async function (id) {
        let DataMovie = (await import("./data/dataMovie.js")).DataMovie;
        let MovieDetail = (await import("./component/MovieDetail/script.js"))
          .MovieDetail;
        let content = document.querySelector("#content");
        content.innerHTML = "";
        try {
          let movie = await DataMovie.requestMovieDetails(id);
          content.appendChild(MovieDetail.render(movie));
        } catch (e) {
          content.innerHTML =
            '<div style="color:#999999">Erreur lors du chargement des détails du film.</div>';
        }
      };

      C.start = function () {
        V.renderNavBar("C.handlerAbout()");
      };

      window.V = {};

      V.renderNavBar = function (hAbout) {
        let header = document.querySelector("#header");
        header.innerHTML = NavBar.format(hAbout, "C.handlerHome()");
        let brand = header.querySelector(".navbar__brand");
        if (brand) {
          brand.addEventListener("click", function (event) {
            event.preventDefault();
            C.handlerHome();
          });
        }
      };

      V.renderMenu = async function () {
        let DataMovie = (await import("./data/dataMovie.js")).DataMovie;
        let MovieCategory = (
          await import("./component/MovieCategory/script.js")
        ).MovieCategory;
        let content = document.querySelector("#content");
        content.innerHTML = `
          <section class="catalog-hero" aria-label="Flouflix sélection du moment">
            <p class="catalog-hero__kicker">Plateforme de streaming</p>
            <h1 class="catalog-hero__title">FLOUFLIX</h1>
            <p class="catalog-hero__text">
              Explore des catalogues par univers, découvre des fiches détaillées et lance ta prochaine soirée cinéma.
            </p>
          </section>
        `;
        try {
          let grouped = await DataMovie.requestMoviesByCategory();
          for (let cat in grouped) {
            content.appendChild(MovieCategory.render(cat, grouped[cat]));
          }
        } catch (e) {
          content.innerHTML =
            '<div style="color:#999999">Erreur lors du chargement des films par catégorie.</div>';
        }
      };

      C.start = function () {
        V.renderNavBar("C.handlerAbout()");
        V.renderMenu();
      };

      C.start();
    </script>
  </body>
</html>
<script type="module"></script>
