<!doctype html>
<html lang="fr">
  <head>
    <title>Flouflix</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="icon" type="image/png" href="../server/images/logo.png" />
  </head>

  <body>
    <header id="header"></header>

    <section id="content"></section>

    <script type="module">
      import { NavBar } from "./component/NavBar/script.js";
      import { DataMovie } from "./data/dataMovie.js";
      import { DataProfile } from "./data/dataProfile.js";
      import { MovieCategory } from "./component/MovieCategory/script.js";
      import { MovieDetail } from "./component/MovieDetail/script.js";

      window.C = {};
      window.V = {};
      C.activeProfileId = null;
      C.profiles = [];

      C.handlerAbout = function () {
        alert("Ceci est une base de projet pour la SAE2.03. Bonne chance !");
      };

      C.handlerSelectProfile = function (profileId) {
        C.activeProfileId = profileId;
        V.renderNavBar();
        V.renderMenu();
      };

      C.handlerHome = function () {
        V.renderMenu();
        return false;
      };

      C.handlerDetail = async function (id) {
        let movie = await DataMovie.requestMovieDetails(id);
        if (!movie || movie.error) {
          V.renderError("Erreur lors du chargement des details du film.");
          return;
        }
        V.renderMovieDetail(movie);
      };

      C.start = function () {
        V.renderApp();
      };

      V.renderNavBar = function () {
        let header = document.querySelector("#header");
        header.innerHTML = NavBar.format(
          "C.handlerAbout()",
          "C.handlerHome()",
          C.profiles,
          C.activeProfileId,
        );

        let brand = header.querySelector(".navbar__brand");
        if (brand) {
          brand.addEventListener("click", function (event) {
            event.preventDefault();
            C.handlerHome();
          });
        }
      };

      V.renderApp = async function () {
        let profiles = await DataProfile.read();
        if (Array.isArray(profiles)) {
          C.profiles = profiles;
          if (!C.activeProfileId && profiles.length > 0) {
            C.activeProfileId = profiles[0].id;
          }
        }

        V.renderNavBar();
        V.renderMenu();
      };

      V.renderMenu = async function () {
        let content = document.querySelector("#content");
        content.innerHTML = `
          <section class="catalog-hero" aria-label="Flouflix selection du moment">
            <p class="catalog-hero__kicker">Plateforme de streaming</p>
            <h1 class="catalog-hero__title">FLOUFLIX</h1>
            <p class="catalog-hero__text">
              Explore des catalogues par univers, decouvre des fiches detaillees et lance ta prochaine soiree cinema.
            </p>
          </section>
        `;

        let grouped = await DataMovie.requestMoviesByCategory();
        if (!grouped || grouped.error) {
          V.renderError("Erreur lors du chargement des films.");
          return;
        }

        let html = "";
        for (let category in grouped) {
          html += MovieCategory.format(category, grouped[category]);
        }
        content.innerHTML += html;
      };

      V.renderMovieDetail = function (movie) {
        let content = document.querySelector("#content");
        content.innerHTML = MovieDetail.format(movie);
      };

      V.renderError = function (txt) {
        let content = document.querySelector("#content");
        content.innerHTML = '<div style="color:#999999">' + txt + "</div>";
      };

      C.start();
    </script>
  </body>
</html>
