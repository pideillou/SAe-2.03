<!DOCTYPE html>
<html lang="fr">
  <head>
    <title>SAE2.03 APP</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/base.css" />
  </head>

  <body>
    <header id="header"></header>

    <section id="content"></section>

    <script type="module">
      import { NavBar } from "./component/NavBar/script.js";

      // Controleur
      // Rappel, écrire window.C plutôt que let C est nécessaire pour tester depuis la console du navigateur
      // Une fois l'application terminée, on pourrait remettre let C.
      window.C = {};

      C.handlerAbout = function () {
        alert(
          "Ceci est une base de projet pour la SAE2.03 édition 2025. Bonne chance !"
        );
      };

      C.start = function () {
        V.renderNavBar("C.handlerAbout()");
      };

      // Vue (contient tout ce qui est relatif à l'affichage)
      window.V = {};

      /**
       * V.renderNavBar
       *
       * Cette fonction est responsable de l'affichage de la barre de navigation (NavBar).
       * Elle sélectionne l'élément HTML avec l'ID "header" et y insère le contenu
       * formaté par le composant NavBar.
       */
      V.renderNavBar = function (hAbout) {
        let header = document.querySelector("#header");
        header.innerHTML = NavBar.format(hAbout);
      };

     // Affichage du Menu (grille de films)

     V.renderMenu = async function () {
       // Charger le template
       const templateFile = await fetch("./component/Menu/template.html");
       const template = await templateFile.text();
       let content = document.querySelector("#content");
       content.innerHTML = template;

       // Affichage du menu directement ici
       // Importer DataMovie
       const module = await import("./data/dataMovie.js");
       const DataMovie = module.DataMovie;

       function createMovieCard(movie) {
         const card = document.createElement("div");
         card.className = "movie-card";

         const img = document.createElement("img");
         img.src = movie.image || "https://via.placeholder.com/200x300?text=No+Image";
         img.alt = movie.title;

         const title = document.createElement("div");
         title.className = "movie-title";
         title.textContent = movie.title;

         const desc = document.createElement("div");
         desc.className = "movie-desc";
         desc.textContent = movie.description || "Pas de description.";

         card.appendChild(img);
         card.appendChild(title);
         card.appendChild(desc);
         return card;
       }

       const grid = document.getElementById("movieGrid");
       if (grid) {
         DataMovie.requestMovies().then(movies => {
           grid.innerHTML = "";
           movies.forEach(movie => {
             grid.appendChild(createMovieCard(movie));
           });
         });
       }
     };

      C.start = function () {
        V.renderNavBar("C.handlerAbout()");
        V.renderMenu();
      };

      C.start(); // Démarre l'application
    </script>
  </body>
</html>
<script type="module"></script>
