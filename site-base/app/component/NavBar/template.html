<nav class="navbar font-sans">
  <div class="navbar__top">
    <a class="navbar__brand" href="#" aria-label="Retour accueil">FLOUFLIX</a>
    <ul class="navbar__list">
      <li class="navbar__item" onclick="{{hHome}}">Accueil</li>
      <li class="navbar__item" onclick="{{hFavorites}}">Favoris</li>
      <li class="navbar__item" onclick="{{hStatistics}}">Statistiques</li>
      <li class="navbar__item" onclick="{{hAbout}}">About</li>
    </ul>
  </div>

  <div class="navbar__search">
    <input
      type="text"
      class="navbar__search-input"
      id="searchInput"
      placeholder="Rechercher un film..."
      aria-label="Rechercher un film par titre"
      onkeyup="C.handlerSearch()"
    />
    <button
      class="navbar__search-button"
      onclick="C.handlerSearch()"
      type="button"
      aria-label="Valider la recherche"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
      >
        <path
          fill="currentColor"
          d="m19.6 21l-6.3-6.3q-.75.6-1.725.95T9.5 16q-2.725 0-4.612-1.888T3 9.5t1.888-4.612T9.5 3t4.613 1.888T16 9.5q0 1.1-.35 2.075T14.7 13.3l6.3 6.3zM9.5 14q1.875 0 3.188-1.312T14 9.5t-1.312-3.187T9.5 5T6.313 6.313T5 9.5t1.313 3.188T9.5 14"
        />
      </svg>
    </button>
  </div>

  <section class="navbar__profiles" aria-label="Choix du profil">
    <div class="navbar__profiles-head">
      <span class="navbar__profiles-label">Profil actif</span>
      <strong class="navbar__profiles-current">{{currentProfileLabel}}</strong>
    </div>
    <div class="navbar__profiles-list">{{profiles}}</div>
  </section>
</nav>
