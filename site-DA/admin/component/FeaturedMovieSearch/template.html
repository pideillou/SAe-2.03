<section class="featured-search font-sans">
  <div class="featured-search__header">
    <h2 class="featured-search__title">Gestion des films mis en avant</h2>
    <p class="featured-search__subtitle">
      Recherchez des films et modifiez leur statut "mis en avant"
    </p>
  </div>

  <div class="featured-search__search-box">
    <input
      type="text"
      class="featured-search__input"
      id="featuredSearchInput"
      placeholder="Rechercher par titre, réalisateur, année..."
      aria-label="Rechercher un film"
    />
    <button
      class="featured-search__button"
      id="featuredSearchBtn"
      type="button"
      aria-label="Valider la recherche"
    >
      Rechercher
    </button>
  </div>

  <div class="featured-search__results" id="featuredResults">
    <div class="featured-search__empty">
      Entrez un mot-clé pour rechercher des films.
    </div>
  </div>
</section>
